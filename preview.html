function show(t,b,wide=false,center=false){title.innerHTML=t;body.innerHTML=b;card.className='card'+(wide?' wide':'')+(center?' center':'');modal.classList.add('show')}function close(){modal.classList.remove('show')}$('#close').onclick=close;
function btn(text,id,cls=''){return `<button class="gbtn ${cls}" id="${id}">${text}</button>`}function count(id){clicks[id]=(clicks[id]||0)+1;return clicks[id]}
function inspect(id){const n=count(id);if(id==='book')show('📘 사회 교과서',`<div class="book-open"><div><b>선사 시대부터 고조선까지</b><div class="book-art">🪨　🏺　🪦</div></div><div class="memo"><small>연필 메모</small><b>“흔적을 잘 살펴볼 것.”</b></div></div><p>오늘 선사 시대부터 고조선까지 배웠다.</p>`,true);if(id==='board')show('🟩 칠판',`<div class="mini-board"><b>오늘의 질문</b><p>옛날 사람들의 생활은<br>어떻게 알 수 있을까?</p><em>남아 있는 흔적</em></div><p>선생님이 마지막에 강조했던 말이다.</p>`);if(id==='clock')show('🕓 교실 시계',`<p>${n>1?'시계는 왜 자꾸 확인하게 되지?':'4시 27분.\n빨리 집에 가야겠다.'}</p>`);if(id==='tv')show('📺 TV',scene==='error'||scene==='ready'?`<div class="tv-panel">⚠ 시간 좌표 오류</div><p>아까는 꺼져 있었는데 저절로 켜졌다.</p>`:`<p>${n>1?'리모컨도 안 보인다.':'전원이 꺼져 있다.'}</p>`);if(id==='desk')show('🗄️ 선생님 책상',`<p>${n>1?'선생님 서랍을 함부로 열면 안 되지.':'달칵.\n잠겨 있다.'}</p>`);if(id==='window')show('🌇 창문',`<div class="sunset">☀️<span>🏫</span></div><p>운동장에도 아무도 없네.</p><small>창틀 한쪽에 작은 모래시계 스티커가 붙어 있다.</small>`);if(id==='sticker')show('⌛ 작은 모래시계 스티커',`<p>창틀에 붙은 작은 모래시계 모양 스티커다.<br>왜 여기 붙어 있지?</p>`);if(id==='trash'){show('🗑️ 쓰레기통',`<p>아무리 방탈출이라도\n쓰레기통까지 봐야 하나...?</p>${btn('그래도 본다','trash2')}`);setTimeout(()=>$('#trash2').onclick=()=>show('🗑️ 쓰레기통','<p>우유갑 하나.<br>끝.</p>'),0)}if(id==='cabinet'){show('🗄️ 뒤쪽 캐비닛',`<div class="box">📦</div><p>위에 작은 상자가 있다.</p>${btn('손을 뻗어 본다','cab2')}`);setTimeout(()=>$('#cab2').onclick=()=>show('🗄️ 뒤쪽 캐비닛','<div class="box">📦</div><p>너무 높아서 닿지 않는다.</p>'),0)}if(id==='covered'){if(scene!=='normal')show('⏳ 시간 이동 장치','<p>둥근 창과 계기판, 작은 램프, 커다란 레버가 달려 있다.</p><div class="readout">상태 : 대기 중<br>목적지 : 미설정</div><small>그리고 눈에 아주 잘 띄는 빨간 버튼이 하나 있다.</small>');else{show('🔎 수상한 물체',`<div class="covered-mini"><div class="mini-cloth">✦</div></div><p>이게 뭐지?</p>${btn('천 아래를 살짝 본다','peek')}`);setTimeout(()=>$('#peek').onclick=()=>{show('🔎 수상한 물체',`<div class="covered-mini"><div class="mini-cloth">✦</div><i>●</i></div><p>천 아래로 금속 기계와 작은 초록 불빛이 보인다.<br>기계...?</p>${btn('천을 걷어 본다','reveal','primary')}`);setTimeout(()=>$('#reveal').onclick=reveal,0)},0)}}}
$$('[data-obj]').forEach(b=>b.onclick=()=>inspect(b.dataset.obj));
function reveal(){close();scene='machine';$('#machine').classList.add('show');say('천 아래에서 낯선 기계가\n모습을 드러냈다.',false,1700)}
$('#redhit').onclick=()=>{show('',`<div class="tape">절대 누르지 마시오</div><div class="red-orb">●</div><p>절대 누르지 말라고 쓰여 있는데.</p>${btn('조금 더 살펴본다','red2')}`,false,true);setTimeout(()=>$('#red2').onclick=()=>{show('',`<div class="tape">절대 누르지 마시오</div><div class="red-orb">●</div><p>......<br>누르면 어떻게 되는지만 확인해 볼까?</p>${btn('누른다','press','danger')}`,false,true);setTimeout(()=>$('#press').onclick=accident,0)},0)};
function startTimer(){timerStart=Date.now();timerId=setInterval(()=>{const r=Math.max(0,1800-Math.floor((Date.now()-timerStart)/1000));$('#timer').textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0')},250)}
function accident(){close();scene='error';startTimer();$('#place').textContent='타임머신';$('#progress').classList.add('show');$('#tverror').classList.add('show');$('#clockhand').classList.add('show');$('#flicker').classList.add('show');$('#shards').classList.add('show');$('#mtext').textContent='역사 정보 오류 · 귀환 좌표 없음';$('#mtext').setAttribute('fill','#ff9c8f');[...$('#lamps').children].forEach((c,i)=>{c.setAttribute('fill',i%2?'#ffd05a':'#f47c6e');c.style.animation=`lamp .55s ${i*.1}s infinite alternate`});$('#reddrawn').style.animation='redpulse .7s infinite alternate';say('귀환 좌표 복구에 필요한\n시간 조각이 과거로 분산되었습니다.',true,1500);setTimeout(()=>say('잠깐...\n이거 진짜 타임머신이야?',true,1450),1550);setTimeout(()=>{$('#coord').classList.add('show');scene='ready'},3250)}
$('#analyze').onclick=()=>{$('#coord').classList.remove('show');leverReady=true;$('#lever').classList.add('ready');$('#leverbar').setAttribute('transform','rotate(-18 322 360)');say('아주 오래된 시간으로\n연결되고 있다.',false,1650)};
$('#lever').onclick=()=>{if(!leverReady)return;$('#stage').classList.add('traveling');$('#whiteflash').classList.add('show');setTimeout(()=>{$('#travelend').classList.add('show')},1200)};
$$('[data-ui]').forEach(b=>b.onclick=()=>{const u=b.dataset.ui;if(u==='bag')show('🎒 가방','<div class="empty">아직 가방이 비어 있습니다.</div>');if(u==='note')show('📖 시간수첩','<div class="empty">아직 기록된 시간 단서가 없습니다.</div>');if(u==='look'){const t=$('#toast');t.textContent='교실 곳곳의 사물을 천천히 살펴보자.';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}if(u==='help')show('🔔 도움 요청',`<p>${scene==='normal'?'교실 가운데에 어제까지 없었던 것 같은 물체가 하나 보여. 천으로 덮여 있네.':'타임머신에서 가장 눈에 띄는 부분을 눌러 봐. 경고문이 붙은 곳 말이야.'}</p>`);if(u==='full')$('#stage').requestFullscreen?.()});
</script></body></html>
