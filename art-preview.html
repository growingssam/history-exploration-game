<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1단계 아트 통일 미리보기</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:'Malgun Gothic','Noto Sans KR',sans-serif;background:#21150d;color:#4b3324}.shell{width:100vw;height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#775237,#1c120c 72%)}.stage{position:relative;width:min(100vw,177.777vh);height:min(100vh,56.25vw);aspect-ratio:16/9;overflow:hidden;background:#c58c53;box-shadow:0 0 0 5px #2e1c12,0 24px 70px #0008}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hud{position:absolute;z-index:60;left:1%;right:1%;top:1%;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.hud>div{display:flex;gap:.55vw;pointer-events:auto}.pill,.hbtn{height:clamp(38px,4.1vw,58px);display:flex;align-items:center;gap:.45em;padding:0 1em;border:3px solid #765034;border-radius:999px;background:linear-gradient(#fff9e9,#f7e4bc);box-shadow:0 4px 0 #a57647;color:#4b3324;font-weight:900}.hbtn{cursor:pointer}.hot{position:absolute;z-index:15;border:0;background:transparent;cursor:pointer;border-radius:18px}.hot:hover{background:radial-gradient(circle,#fff5 0,#ffd96a22 55%,transparent 72%)}.char{position:absolute;z-index:50;left:0;bottom:0;width:17.5%;height:auto;max-height:42%;object-fit:contain;filter:drop-shadow(0 7px 5px #3d241c55)}.bubble{position:absolute;z-index:51;left:13.7%;bottom:6%;max-width:31%;padding:.78em 1.15em;border:3px solid #6b4830;border-radius:20px;background:linear-gradient(#fffdf4,#f8ead0);box-shadow:0 5px 0 #a87849;font-weight:800;font-size:clamp(13px,1.05vw,19px);line-height:1.45}.bubble.hidden{display:none}.modal{position:absolute;z-index:100;inset:0;display:none;place-items:center;background:#2b1b1275;backdrop-filter:blur(1.5px)}.modal.show{display:grid}.card{position:relative;width:min(68%,900px);max-height:80%;overflow:auto;padding:2%;border:5px solid #60422d;border-radius:24px;background:linear-gradient(#fff9ea,#f3e2c2);box-shadow:0 13px 0 #3d291dbb,0 26px 60px #0008}.card.small{width:min(42%,600px)}.close{position:absolute;right:14px;top:14px;width:42px;height:42px;border:3px solid #60422d;border-radius:50%;background:#fff8e8;font-size:24px;cursor:pointer}.title{font-size:clamp(18px,1.5vw,26px);font-weight:900;margin-bottom:.7em}.inspect{display:block;width:100%;max-height:53vh;object-fit:cover;border-radius:18px;border:3px solid #8b6648;box-shadow:0 8px 22px #4b2d1f35}.card p{font-size:clamp(14px,1.05vw,19px);line-height:1.55;font-weight:700;white-space:pre-line}.gbtn{border:3px solid #65452f;background:#ffe3a0;padding:.7em 1.2em;border-radius:999px;font-weight:900;box-shadow:0 4px 0 #9d7046;cursor:pointer}.machine{position:absolute;z-index:24;left:52.2%;top:24%;width:31.5%;height:63%;display:none;filter:drop-shadow(0 16px 18px #4c2c1d66)}.machine.show{display:block}.machine img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.monitor{position:absolute;z-index:4;left:26.5%;top:16.2%;width:50%;height:12.5%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8f1d1;font-size:clamp(7px,.68vw,12px);font-weight:800;text-align:center}.monitor.err{color:#ffafa3;text-shadow:0 0 8px #ff554466}.redhit{position:absolute;z-index:6;left:39%;top:69.5%;width:11%;height:9.2%;border:0;background:transparent;border-radius:50%;cursor:pointer}.lever{position:absolute;z-index:6;right:15.5%;top:61%;width:13.5%;height:22%;border:0;background:transparent;cursor:pointer}.lever.ready{filter:drop-shadow(0 0 12px #ffd95d)}.tv{position:absolute;z-index:26;left:55.16%;top:4.65%;width:15.45%;height:15.05%;display:none;place-items:center;overflow:hidden;border-radius:1.2%;background:radial-gradient(circle,#263238,#101617 70%);color:#ffb1a6;font-weight:900;text-align:center;text-shadow:0 0 7px #ff675c88;box-shadow:inset 0 0 18px #000b}.tv.show{display:grid}.tv:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 3px,#ffffff09 4px)}.rev{position:absolute;z-index:27;left:46.1%;top:10.7%;width:.22%;height:7.3%;border-radius:99px;background:#d84e44;transform-origin:50% 90%;display:none}.rev.show{display:block;animation:reverse 1.2s linear infinite}@keyframes reverse{to{transform:rotate(-360deg)}}.flicker{position:absolute;z-index:23;inset:7.6% 0 0;display:none;background:radial-gradient(circle at 64% 46%,#ffd17a44,transparent 38%);pointer-events:none}.flicker.show{display:block;animation:flick .6s steps(2,end) infinite}@keyframes flick{0%,100%{opacity:.12}50%{opacity:.7}}.coord{position:absolute;z-index:80;right:2%;top:13%;width:25%;display:none;padding:1.2%;border:4px solid #65442e;border-radius:22px;background:linear-gradient(#fff9e9,#f1dfbc);box-shadow:0 8px 0 #9b6f45;text-align:center}.coord.show{display:block}.coord .icons{font-size:2.2vw;margin:1em}.shards{position:absolute;z-index:45;inset:0;pointer-events:none;display:none}.shards.show{display:block}.shards span{position:absolute;left:64%;top:51%;color:#79eaff;font-size:2.5vw;text-shadow:0 0 10px #6eeaff;animation:fly 1.9s ease-in-out forwards}.s1{--x:-55vw;--y:-30vh}.s2{--x:30vw;--y:-25vh}.s3{--x:-45vw;--y:32vh}.s4{--x:31vw;--y:28vh}@keyframes fly{0%{opacity:0;transform:translate(0,0) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.1) rotate(220deg)}}.travel{position:absolute;z-index:120;inset:0;display:none;place-items:center;background:radial-gradient(circle,#fff9dc,#cfe8e6 45%,#17303d 85%);font-size:4vw;font-weight:900}.travel.show{display:grid}.sticker{position:absolute;z-index:16;left:94%;top:29%;border:0;background:transparent;font-size:1.5vw;cursor:pointer}
</style></head><body><main class="shell"><section class="stage" id="stage"><img class="bg" src="src/assets/classroom.png" alt="교실">
<div class="hud"><div><div class="pill">⏱ <b id="timer">--:--</b></div><div class="pill">🟢 <b id="place">교실</b></div></div><div><button class="hbtn">🎒 가방</button><button class="hbtn">📖 시간수첩</button><button class="hbtn">👀 둘러보기</button><button class="hbtn">🔔 도움 요청</button><button class="hbtn">⛶</button></div></div>
<button class="hot" style="left:0%;top:10%;width:40%;height:48%"></button><button class="hot" style="left:39%;top:3%;width:10%;height:18%"></button><button class="hot" style="left:52%;top:3%;width:18%;height:18%"></button><button class="hot" style="left:0%;top:57%;width:36%;height:28%"></button><button class="hot" style="left:78%;top:5%;width:22%;height:52%"></button><button class="hot" style="left:87%;top:64%;width:8%;height:19%"></button><button class="hot" style="left:38%;top:45%;width:17%;height:29%"></button><button class="hot" id="covered" style="left:47%;top:22%;width:38%;height:64%"></button><button class="hot" id="book" style="left:2%;top:91%;width:24%;height:9%"></button><button class="sticker">⌛</button>
<img id="hero" class="char" src="src/assets/character_normal.png" alt="주인공"><div id="bubble" class="bubble">다들 갔네.<br>나도 가방 챙겨서 가야겠다.</div>
<div id="machine" class="machine"><img src="src/assets/time_machine.png"><div id="monitor" class="monitor"><b>시간 이동 장치</b><span>상태 : 대기 중</span><span>목적지 : 미설정</span></div><button id="redhit" class="redhit"></button><button id="lever" class="lever"></button></div>
<div id="tverror" class="tv">⚠<br>시간 좌표 오류</div><div id="rev" class="rev"></div><div id="flick" class="flicker"></div><div id="shards" class="shards"><span class="s1">◆</span><span class="s2">◆</span><span class="s3">◆</span><span class="s4">◆</span></div><div id="coord" class="coord"><b>불안정한 시간 좌표 발견</b><div class="icons">🪨　🔥　🦬</div><button id="analyze" class="gbtn">좌표 분석</button></div><div id="travel" class="travel">시간 이동 중...</div>
<div id="modal" class="modal"><div id="card" class="card"><button id="close" class="close">×</button><div id="mtitle" class="title"></div><div id="mbody"></div></div></div>
</section></main><script>
let coveredStep=0, revealed=false, err=false, leverReady=false, timerStart=null, timerInt=null;const $=s=>document.querySelector(s);const modal=$('#modal'), card=$('#card'), mtitle=$('#mtitle'), mbody=$('#mbody');function openModal(title,html,small=false){mtitle.textContent=title;mbody.innerHTML=html;card.className='card'+(small?' small':'');modal.classList.add('show')}function close(){modal.classList.remove('show')}$('#close').onclick=close;$('#book').onclick=()=>openModal('사회 교과서',`<img class="inspect" src="src/assets/book_closeup.png"><p>오늘 선사 시대부터 고조선까지 배웠다.</p>`);$('#covered').onclick=()=>{if(revealed){openModal('시간 이동 장치','<p>둥근 창과 계기판, 작은 램프, 커다란 레버가 달려 있다.</p><p><b>상태 : 대기 중<br>목적지 : 미설정</b></p>',true);return}coveredStep=1;openModal('수상한 물체',`<img class="inspect" src="src/assets/covered_closeup_1.png"><p>이게 뭐지?</p><button class="gbtn" id="under">천 아래를 살짝 본다</button>`);setTimeout(()=>{$('#under').onclick=()=>{openModal('수상한 물체',`<img class="inspect" src="src/assets/covered_closeup_2.png"><p>천 아래로 금속 기계 일부와 작은 초록 불빛이 보인다.<br>기계...?</p><button class="gbtn" id="reveal">천을 걷어 본다</button>`);setTimeout(()=>{$('#reveal').onclick=()=>{close();revealed=true;$('#machine').classList.add('show');$('#bubble').innerHTML='천 아래에서 낯선 기계가<br>모습을 드러냈다.'}},0)}},0)};$('#redhit').onclick=()=>{openModal('절대 누르지 마시오',`<p>절대 누르지 말라고 쓰여 있는데.</p><button class="gbtn" id="more">조금 더 살펴본다</button>`,true);setTimeout(()=>{$('#more').onclick=()=>{openModal('절대 누르지 마시오',`<p>......<br>누르면 어떻게 되는지만 확인해 볼까?</p><button class="gbtn" id="press">누른다</button>`,true);setTimeout(()=>{$('#press').onclick=accident},0)}},0)};function accident(){close();err=true;timerStart=Date.now();$('#place').textContent='타임머신';$('#tverror').classList.add('show');$('#rev').classList.add('show');$('#flick').classList.add('show');$('#shards').classList.add('show');$('#hero').src='src/assets/character_surprised.png';$('#bubble').innerHTML='잠깐...<br>이거 진짜 타임머신이야?';$('#monitor').classList.add('err');$('#monitor').innerHTML='<b>시간 이동 장치</b><span>역사 정보 오류</span><span>귀환 좌표 없음</span>';timerInt=setInterval(()=>{const s=Math.max(0,1800-(Date.now()-timerStart)/1000)|0;$('#timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},250);setTimeout(()=>$('#coord').classList.add('show'),1900)}$('#analyze').onclick=()=>{$('#coord').classList.remove('show');leverReady=true;$('#lever').classList.add('ready');$('#bubble').innerHTML='아주 오래된 시간으로<br>연결되고 있다.'};$('#lever').onclick=()=>{if(!leverReady)return;$('#travel').classList.add('show')};
</script></body></html>
